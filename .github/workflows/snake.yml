name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Misagh95
          # NOTE: snk writes its SVGs read-only, which made it impossible for
          # the stats step to reuse ./dist. Keep the two in separate folders
          # and publish both from the workflow instead.
          outputs: |
            snake-dist/github-contribution-grid-snake.svg
            snake-dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/gen_cards.py --publish

      - name: Collect all assets into dist
        run: |
          mkdir -p dist
          cp snake-dist/*.svg dist/
          ls -l dist

      - name: Verify generated assets
        run: |
          fail=0
          for f in profile-details.svg repos-per-language.svg most-commit-language.svg \
                   productive-time.svg github-contribution-grid-snake.svg \
                   github-contribution-grid-snake-dark.svg; do
            if [ -s "dist/$f" ]; then
              echo "ok dist/$f ($(wc -c < "dist/$f") bytes)"
            else
              echo "::error::missing or empty asset: dist/$f"
              fail=1
            fi
          done
          exit $fail

      - name: Publish to output branch
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
