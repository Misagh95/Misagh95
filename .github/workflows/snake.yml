name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Misagh95
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate stats cards
        run: |
          python3 .github/scripts/gen_cards.py --publish

      - name: Verify generated assets
        run: |
          for f in profile-details.svg repos-per-language.svg most-commit-language.svg productive-time.svg; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::missing or empty asset: dist/$f"
              exit 1
            fi
            echo "ok dist/$f ($(wc -c < "dist/$f") bytes)"
          done

      - name: Publish to output branch
        if: success() || failure()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
